<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BodyPose Tracker</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
        }
        
        #container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        h1 {
            color: #6c5ce7;
            margin-bottom: 10px;
        }
        
        #canvas-container {
            position: relative;
            margin: 20px 0;
            border: 2px solid #6c5ce7;
            border-radius: 8px;
            overflow: hidden;
        }
        
        #controls {
            margin: 20px 0;
            display: flex;
            gap: 10px;
        }
        
        button {
            background-color: #6c5ce7;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        
        button:hover {
            background-color: #5649c0;
        }
        
        #stats {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-value {
            font-size: 24px;
            color: #00b894;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
    <script src="https://unpkg.com/ml5@latest/dist/ml5.min.js"></script>
</head>
<body>
    <div id="container">
        <h1>BodyPose Tracker</h1>
        <p>Seguimiento de postura corporal en tiempo real</p>
        
        <div id="canvas-container"></div>
        
        <div id="controls">
            <button id="toggleCamera">Ocultar Cámara</button>
            <button id="toggleSkeleton">Ocultar Esqueleto</button>
            <button id="toggleLine">Mostrar Línea</button> <!-- Nuevo botón -->
        </div>
        
        <div id="stats">
            <div class="stat">
                <div class="stat-value" id="poseCount">0</div>
                <div>Posturas detectadas</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="fps">0</div>
                <div>FPS</div>
            </div>
        </div>
    </div>

    <script src="sketch.js"></script>
</body>
</html>
